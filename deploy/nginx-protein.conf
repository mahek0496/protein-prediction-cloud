# Option B: nginx serves the built React app and forwards /api/ to FastAPI on the same EC2 instance.
# Install: sudo cp deploy/nginx-protein.conf /etc/nginx/conf.d/protein.conf
#          sudo nginx -t && sudo systemctl enable --now nginx && sudo systemctl reload nginx
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/protein;          # contents of frontend/dist
    index index.html;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /docs { proxy_pass http://127.0.0.1:8000; }
    location /openapi.json { proxy_pass http://127.0.0.1:8000; }

    # React Router: send unknown paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
